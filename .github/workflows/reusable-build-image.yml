# Builds one service image, pushes it to ECR and opens a PR with the new tag in the GitOps repository.
# Called once per service by release-images.yml.
name: Build image

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  GITOPS_REPOSITORY: diploma-growpath-argocd
  SERVICE: ${{ inputs.service }}

jobs:
  image:
    name: Build, push and bump the tag
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Assume the AWS push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Check whether the image already exists
        id: exists
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/growpath/${{ inputs.service }}:${{ steps.tag.outputs.value }}
        run: |
          # Tags are immutable, so a re-run of the same commit must not push again.
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/growpath/${{ inputs.service }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

      - name: Check that the GitOps App is configured
        id: gitops
        env:
          APP_ID: ${{ secrets.GITOPS_APP_ID }}
        run: echo "enabled=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create a GitOps repository token
        if: steps.gitops.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPOSITORY }}

      - name: Check out the GitOps repository
        if: steps.gitops.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Set the image tag in the values file
        if: steps.gitops.outputs.enabled == 'true'
        id: values
        working-directory: gitops
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          file="apps/values/${SERVICE}.yaml"
          if [ ! -f "$file" ]; then
            echo "::notice::$file does not exist yet, skipping the tag bump"
            exit 0
          fi
          yq -i '.image.tag = strenv(TAG)' "$file"

      - name: Open a PR with the new image tag
        if: steps.gitops.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: gitops
          token: ${{ steps.app.outputs.token }}
          branch: bump/${{ inputs.service }}-${{ steps.tag.outputs.value }}
          base: main
          commit-message: Bump ${{ inputs.service }} image to ${{ steps.tag.outputs.value }}
          title: Bump ${{ inputs.service }} image to ${{ steps.tag.outputs.value }}
          author: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          committer: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          body: |
            * Image ${{ steps.ecr.outputs.registry }}/growpath/${{ inputs.service }}:${{ steps.tag.outputs.value }}
            * Source commit ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
