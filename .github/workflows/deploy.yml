name: Deploy images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma separated: commerce, entitlement, plant-care, expert-consultation, or all"
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  GITOPS_REPOSITORY: diploma-growpath-argocd

jobs:
  select:
    name: Select services
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Pick services to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.services }}
        run: .github/scripts/select-services.sh

  build:
    name: Build ${{ matrix.service }}
    needs: select
    if: needs.select.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Derive the image tag
        id: tag
        run: echo "value=${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Assume the AWS push role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/growpath/${{ matrix.service }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Check that the GitOps App is configured
        id: gitops
        env:
          APP_ID: ${{ secrets.GITOPS_APP_ID }}
        run: echo "enabled=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create a GitOps repository token
        if: steps.gitops.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPOSITORY }}

      - name: Check out the GitOps repository
        if: steps.gitops.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Open a PR with the new image tag
        if: steps.gitops.outputs.enabled == 'true'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/growpath/${{ matrix.service }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ env.SOURCE_SHA }}
        run: ../.github/scripts/bump-image-tag.sh
