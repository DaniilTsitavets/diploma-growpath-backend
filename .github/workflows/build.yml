name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - services/**
      - libs/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      service:
        description: Service to build
        type: choice
        options: [all, commerce, entitlement, plant-care, expert-consultation]
        default: all

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  select:
    name: Select services
    needs: ci
    if: ${{ !cancelled() && needs.ci.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Pick services to build
        id: pick
        env:
          INPUT: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/select-services.sh

  build:
    name: Build ${{ matrix.service }}
    needs: select
    if: needs.select.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-service.yml
    with:
      service: ${{ matrix.service }}
