# Builds the images of changed services after CI passes on main and opens a PR
# with the new image tag in the GitOps repository. Can also be started by hand.
name: Release images
run-name: Release images (${{ github.event_name == 'workflow_dispatch' && inputs.service || github.sha }})

on:
  push:
    branches: [main]
    paths:
      - services/**
      - libs/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      service:
        description: Service to build
        type: choice
        options: [all, commerce, entitlement, plant-care, expert-consultation]
        default: all

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  GITOPS_REPOSITORY: diploma-growpath-argocd

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  select:
    name: Select services
    needs: ci
    if: ${{ !cancelled() && needs.ci.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick services to build
        id: pick
        env:
          INPUT: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/select-services.sh

  build:
    name: Build ${{ matrix.service }} image
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Assume the AWS push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Check whether the image already exists
        id: exists
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/growpath/${{ matrix.service }}:${{ steps.tag.outputs.value }}
        run: |
          # Tags are immutable, so a re-run of the same commit must not push again.
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU for the arm64 build
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build and push the image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/growpath/${{ matrix.service }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Check that the GitOps App is configured
        id: gitops
        env:
          APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
        run: echo "enabled=$([ -n "$APP_CLIENT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create a GitOps repository token
        if: steps.gitops.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPOSITORY }}

      - name: Check out the GitOps repository
        if: steps.gitops.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Set the image tag in the values files
        if: steps.gitops.outputs.enabled == 'true'
        id: values
        working-directory: gitops
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # The service itself and its one-off jobs (for example plant-care-ingestion) share one image.
          files=$(ls "apps/prod/${SERVICE}.yaml" apps/prod/"${SERVICE}"-*.yaml 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::notice::No values for ${SERVICE} in apps/prod yet, skipping the tag bump"
            exit 0
          fi
          for file in $files; do
            yq -i '.image.tag = strenv(TAG)' "$file"
          done

      - name: Open a PR with the new image tag
        if: steps.gitops.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: gitops
          token: ${{ steps.app.outputs.token }}
          branch: bump/${{ matrix.service }}-${{ steps.tag.outputs.value }}
          base: main
          commit-message: Bump ${{ matrix.service }} image to ${{ steps.tag.outputs.value }}
          title: Bump ${{ matrix.service }} image to ${{ steps.tag.outputs.value }}
          author: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          committer: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          body: |
            * Image ${{ steps.ecr.outputs.registry }}/growpath/${{ matrix.service }}:${{ steps.tag.outputs.value }}
            * Source commit ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
