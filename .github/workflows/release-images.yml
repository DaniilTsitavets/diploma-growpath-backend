# Builds the images of changed services after CI passes on main and opens a PR
# with the new image tag in the GitOps repository. Can also be started by hand.
name: Release images
run-name: Release images (${{ github.event_name == 'workflow_dispatch' && inputs.service || github.sha }})

on:
  push:
    branches: [main]
    paths:
      - services/**
      - libs/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      service:
        description: Service to build
        type: choice
        options: [all, commerce, entitlement, plant-care, expert-consultation]
        default: all

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  GITOPS_REPOSITORY: diploma-growpath-argocd

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  select:
    name: Select services
    needs: ci
    if: ${{ !cancelled() && needs.ci.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick services to build
        id: pick
        env:
          INPUT: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/select-services.sh

  build:
    name: Build ${{ matrix.service }} ${{ matrix.arch }} image
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.services != '[]' }}
    runs-on: ${{ matrix.runner }}
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the ECR image
        id: image
        uses: ./.github/actions/ecr-image
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          service: ${{ matrix.service }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Buildx
        if: steps.image.outputs.found == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image is pushed by digest only; the publish job joins both architectures under one tag.
      - name: Build and push the image
        if: steps.image.outputs.found == 'false'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=max

      - name: Record the image digest
        if: steps.image.outputs.found == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the image digest
        if: steps.image.outputs.found == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} image
    needs: [select, build]
    # A service whose build failed fails here on its own; the other services still go out.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the ECR image
        id: image
        uses: ./.github/actions/ecr-image
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          service: ${{ matrix.service }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download the image digests
        if: steps.image.outputs.found == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Publish one tag for both architectures
        if: steps.image.outputs.found == 'false'
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          if [ "$(ls | wc -l)" -ne 2 ]; then
            echo "::error::Expected one digest per architecture, found: $(ls | tr '\n' ' ')"
            exit 1
          fi
          docker buildx imagetools create --tag "$REPOSITORY:$TAG" $(printf "$REPOSITORY@sha256:%s " *)
          docker buildx imagetools inspect "$REPOSITORY:$TAG"

      - name: Check that the GitOps App is configured
        id: gitops
        env:
          APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
        run: echo "enabled=$([ -n "$APP_CLIENT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create a GitOps repository token
        if: steps.gitops.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPOSITORY }}

      - name: Check out the GitOps repository
        if: steps.gitops.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Set the image tag in the values files
        if: steps.gitops.outputs.enabled == 'true'
        id: values
        working-directory: gitops
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # The service itself and its one-off jobs (for example plant-care-ingestion) share one image.
          files=$(ls "apps/prod/${SERVICE}.yaml" apps/prod/"${SERVICE}"-*.yaml 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::notice::No values for ${SERVICE} in apps/prod yet, skipping the tag bump"
            exit 0
          fi
          for file in $files; do
            yq -i '.image.tag = strenv(TAG)' "$file"
          done

      - name: Open a PR with the new image tag
        if: steps.gitops.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: gitops
          token: ${{ steps.app.outputs.token }}
          branch: bump/${{ matrix.service }}-${{ steps.image.outputs.tag }}
          base: main
          commit-message: Bump ${{ matrix.service }} image to ${{ steps.image.outputs.tag }}
          title: Bump ${{ matrix.service }} image to ${{ steps.image.outputs.tag }}
          author: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          committer: growpath-ci[bot] <growpath-ci[bot]@users.noreply.github.com>
          body: |
            * Image ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }} (linux/amd64, linux/arm64)
            * Source commit ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
