name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The images use Python 3.12; newer interpreters change the HTTP status phrases that end up in the OpenAPI files.
  UV_PYTHON: "3.12"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check libs services
      - run: uv run ruff format --check libs services

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages pytest libs/observability

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service: [commerce, entitlement, plant-care, expert-consultation]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --all-packages --frozen
      - name: Unit and database tests, coverage gate 70%
        working-directory: services/${{ matrix.service }}
        run: uv run --all-packages pytest --cov-fail-under=70
