name: Prepare the ECR image
description: Assumes the AWS push role, logs in to ECR, and reports the image tag and whether that tag already exists.

inputs:
  role-arn:
    description: AWS role to assume (OIDC)
    required: true
  service:
    description: Service name; the image lives in the growpath/<service> repository
    required: true
  aws-region:
    description: AWS region of the registry
    default: eu-north-1

outputs:
  repository:
    description: Full repository URI without a tag
    value: ${{ steps.exists.outputs.repository }}
  tag:
    description: Image tag, the first 12 characters of the commit SHA
    value: ${{ steps.exists.outputs.tag }}
  found:
    description: "'true' when the tag is already in the registry"
    value: ${{ steps.exists.outputs.found }}

runs:
  using: composite
  steps:
    - name: Assume the AWS push role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Log in to ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

    - name: Work out the image tag and whether it exists
      id: exists
      shell: bash
      env:
        REPOSITORY: ${{ steps.ecr.outputs.registry }}/growpath/${{ inputs.service }}
      run: |
        tag="${GITHUB_SHA::12}"
        {
          echo "repository=$REPOSITORY"
          echo "tag=$tag"
        } >> "$GITHUB_OUTPUT"
        # Tags are immutable, so a re-run of the same commit must not push again.
        if docker buildx imagetools inspect "$REPOSITORY:$tag" > /dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
