name: growpath

x-postgres: &postgres
  image: postgres:16.15-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  localstack:
    image: localstack/localstack:2026.10.6
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?export LOCALSTACK_AUTH_TOKEN before starting}
      SERVICES: apigateway,cognito-idp,sns,sqs,s3,sts,iam
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./infra/localstack/init:/etc/localstack/init:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:4566/_localstack/init/ready', timeout=3))['completed'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  commerce:
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
    environment:
      COMMERCE_DATABASE_URL: postgresql+psycopg://commerce:${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}@commerce-db:5432/commerce
      COMMERCE_ORDER_PLACED_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-placed
      # LocalStack only. The code uses the default AWS credential chain and never reads keys
      # itself, so on EKS the pod gets its role through Pod Identity / OIDC without these.
      COMMERCE_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      commerce-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  entitlement:
    build:
      context: .
      dockerfile: services/entitlement/Dockerfile
    environment:
      ENTITLEMENT_DATABASE_URL: postgresql+psycopg://entitlement:${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD}@entitlement-db:5432/entitlement
      ENTITLEMENT_ORDER_PLACED_QUEUE_URL: http://localstack:4566/000000000000/entitlement-order-placed
      ENTITLEMENT_TICKET_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/entitlement-ticket-events
      # LocalStack only; see the commerce service for why the code never reads keys itself.
      ENTITLEMENT_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      entitlement-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  plant-care:
    build:
      context: .
      dockerfile: services/plant-care/Dockerfile
    environment:
      PLANT_CARE_DATABASE_URL: postgresql+psycopg://plant_care:${PLANT_CARE_DB_PASSWORD:?set PLANT_CARE_DB_PASSWORD}@plant-care-db:5432/plant_care
      PLANT_CARE_ORDER_PLACED_QUEUE_URL: http://localstack:4566/000000000000/plant-care-order-placed
      PLANT_CARE_TICKET_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/plant-care-ticket-events
      PLANT_CARE_ENTITLEMENT_URL: http://entitlement:8000
      PLANT_CARE_ESCALATION_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:escalation-requested
      # Equal to the entitlement default (ENTITLEMENT_EXPERT_RESERVATION_TTL_HOURS = 24).
      PLANT_CARE_EXPERT_RESERVATION_TTL_SECONDS: "86400"
      PLANT_CARE_ESCALATION_ACK_MARGIN_SECONDS: "900"
      PLANT_CARE_ESCALATION_REPEATER_GRACE_SECONDS: "30"
      # mock | openrouter | bedrock; the key is needed (and validated by the service) only for openrouter.
      PLANT_CARE_MODEL_PROVIDER: ${PLANT_CARE_MODEL_PROVIDER:-mock}
      PLANT_CARE_MODEL_MOCK_BEHAVIOR: ${PLANT_CARE_MODEL_MOCK_BEHAVIOR:-complete}
      # Model calls per diagnosis attempt (parallel from 2 on); one attempt spends one AI quota unit.
      PLANT_CARE_DIAGNOSIS_SAMPLES: ${PLANT_CARE_DIAGNOSIS_SAMPLES:-1}
      PLANT_CARE_DIAGNOSIS_SAMPLE_TEMPERATURE: ${PLANT_CARE_DIAGNOSIS_SAMPLE_TEMPERATURE:-0.7}
      PLANT_CARE_DIAGNOSIS_DOMINANT_SUPPORT: ${PLANT_CARE_DIAGNOSIS_DOMINANT_SUPPORT:-high}
      PLANT_CARE_DIAGNOSIS_RIVAL_SUPPORTS: ${PLANT_CARE_DIAGNOSIS_RIVAL_SUPPORTS:-medium,high}
      PLANT_CARE_OPENROUTER_API_KEY: ${PLANT_CARE_OPENROUTER_API_KEY:-}
      PLANT_CARE_OPENROUTER_MODEL: ${PLANT_CARE_OPENROUTER_MODEL:-}
      # Care chat: an empty chat model falls back to PLANT_CARE_OPENROUTER_MODEL.
      PLANT_CARE_OPENROUTER_CHAT_MODEL: ${PLANT_CARE_OPENROUTER_CHAT_MODEL:-}
      PLANT_CARE_CHAT_TOP_K: "4"
      PLANT_CARE_CHAT_HISTORY_TURNS: "3"
      PLANT_CARE_CHAT_MODEL_TIMEOUT_SECONDS: "8"
      # LocalStack only; see the commerce service for why the code never reads keys itself.
      PLANT_CARE_AWS_ENDPOINT_URL: http://localstack:4566
      # Presigned photo URLs are opened from the host, where LocalStack is on loopback.
      PLANT_CARE_PHOTOS_PUBLIC_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      plant-care-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      entitlement:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  expert-consultation:
    build:
      context: .
      dockerfile: services/expert-consultation/Dockerfile
    environment:
      EXPERT_CONSULTATION_DATABASE_URL: postgresql+psycopg://expert:${EXPERT_DB_PASSWORD:?set EXPERT_DB_PASSWORD}@expert-db:5432/expert
      EXPERT_CONSULTATION_ESCALATION_QUEUE_URL: http://localstack:4566/000000000000/expert-escalation-requested
      EXPERT_CONSULTATION_TICKET_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ticket-events
      # The author's assumption: an unanswered ticket expires 72 hours after it was created.
      EXPERT_CONSULTATION_TICKET_TTL_SECONDS: "259200"
      EXPERT_CONSULTATION_REPUBLISH_GRACE_SECONDS: "30"
      # LocalStack only; see the commerce service for why the code never reads keys itself.
      EXPERT_CONSULTATION_AWS_ENDPOINT_URL: http://localstack:4566
      # Presigned photo URLs are opened from the host, where LocalStack is on loopback.
      EXPERT_CONSULTATION_PHOTOS_PUBLIC_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      expert-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  commerce-db:
    <<: *postgres
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}

  entitlement-db:
    <<: *postgres
    environment:
      POSTGRES_DB: entitlement
      POSTGRES_USER: entitlement
      POSTGRES_PASSWORD: ${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD}

  plant-care-db:
    <<: *postgres
    environment:
      POSTGRES_DB: plant_care
      POSTGRES_USER: plant_care
      POSTGRES_PASSWORD: ${PLANT_CARE_DB_PASSWORD:?set PLANT_CARE_DB_PASSWORD}

  expert-db:
    <<: *postgres
    environment:
      POSTGRES_DB: expert
      POSTGRES_USER: expert
      POSTGRES_PASSWORD: ${EXPERT_DB_PASSWORD:?set EXPERT_DB_PASSWORD}
