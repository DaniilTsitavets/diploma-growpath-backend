name: growpath

x-postgres: &postgres
  image: postgres:16.15-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  localstack:
    image: localstack/localstack:2026.10.6
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?export LOCALSTACK_AUTH_TOKEN before starting}
      SERVICES: apigateway,cognito-idp,sns,sqs,s3,sts,iam
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./infra/localstack/init:/etc/localstack/init:ro
    depends_on:
      echo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:4566/_localstack/init/ready', timeout=3))['completed'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Stand-in upstream for the gateway proxy check; replaced by real services later.
  echo:
    image: mendhak/http-https-echo:43
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"

  commerce:
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
    environment:
      COMMERCE_DATABASE_URL: postgresql+psycopg://commerce:${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}@commerce-db:5432/commerce
      COMMERCE_ORDER_PLACED_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-placed
      # LocalStack only. The code uses the default AWS credential chain and never reads keys
      # itself, so on EKS the pod gets its role through Pod Identity / OIDC without these.
      COMMERCE_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      commerce-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  entitlement:
    build:
      context: .
      dockerfile: services/entitlement/Dockerfile
    environment:
      ENTITLEMENT_DATABASE_URL: postgresql+psycopg://entitlement:${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD}@entitlement-db:5432/entitlement
      ENTITLEMENT_ORDER_PLACED_QUEUE_URL: http://localstack:4566/000000000000/entitlement-order-placed
      ENTITLEMENT_TICKET_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/entitlement-ticket-events
      # LocalStack only; see the commerce service for why the code never reads keys itself.
      ENTITLEMENT_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      entitlement-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  plant-care:
    build:
      context: .
      dockerfile: services/plant-care/Dockerfile
    environment:
      PLANT_CARE_DATABASE_URL: postgresql+psycopg://plant_care:${PLANT_CARE_DB_PASSWORD:?set PLANT_CARE_DB_PASSWORD}@plant-care-db:5432/plant_care
      PLANT_CARE_ORDER_PLACED_QUEUE_URL: http://localstack:4566/000000000000/plant-care-order-placed
      # LocalStack only; see the commerce service for why the code never reads keys itself.
      PLANT_CARE_AWS_ENDPOINT_URL: http://localstack:4566
      # Presigned photo URLs are opened from the host, where LocalStack is on loopback.
      PLANT_CARE_PHOTOS_PUBLIC_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      plant-care-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  commerce-db:
    <<: *postgres
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}

  entitlement-db:
    <<: *postgres
    environment:
      POSTGRES_DB: entitlement
      POSTGRES_USER: entitlement
      POSTGRES_PASSWORD: ${ENTITLEMENT_DB_PASSWORD:?set ENTITLEMENT_DB_PASSWORD}

  plant-care-db:
    <<: *postgres
    environment:
      POSTGRES_DB: plant_care
      POSTGRES_USER: plant_care
      POSTGRES_PASSWORD: ${PLANT_CARE_DB_PASSWORD:?set PLANT_CARE_DB_PASSWORD}

  expert-db:
    <<: *postgres
    environment:
      POSTGRES_DB: expert
      POSTGRES_USER: expert
      POSTGRES_PASSWORD: ${EXPERT_DB_PASSWORD:?set EXPERT_DB_PASSWORD}
