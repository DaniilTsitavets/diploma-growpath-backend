# Throwaway PostgreSQL for schema and repository tests: no volume, no password, loopback only.
name: growpath-test

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
