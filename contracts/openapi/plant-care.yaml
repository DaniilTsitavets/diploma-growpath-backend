openapi: 3.1.0
info:
  title: GrowPath plant-care
  version: 0.1.0
  description: Plant journals and their updates, AI diagnosis, escalation to an expert and the care chat.
    Consumes `order.placed` and `ticket.*`, publishes `escalation.requested`. Identity arrives in the
    `X-User-Id` header, which the API gateway sets from the verified JWT. The gateway exposes `/v1/journals/**`
    and `/v1/updates/**`, and `/v1/plants/{slug}` without authorization; the `internal` tag marks operations
    it does not expose.
paths:
  /health/live:
    get:
      tags:
      - health
      - internal
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: internal
  /health/ready:
    get:
      tags:
      - health
      - internal
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The database or a message queue is unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - service-unavailable
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: internal
  /v1/journals:
    get:
      tags:
      - journals
      summary: List Journals
      description: The journals of the user, newest first; pass `next_cursor` of a page as `cursor` for
        more.
      operationId: list_journals_v1_journals_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Cursor
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      - name: x-user-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Groups
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalListResponse'
        '401':
          description: '`X-User-Id` is missing or not a user id'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - unauthorized
        '403':
          description: 'The caller is not a customer: `X-User-Groups` lacks `users` or has `experts`/`admins`'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - forbidden
        '422':
          description: A query parameter is invalid, or the cursor is not valid
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - validation-error
                      - invalid-cursor
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: public
  /v1/journals/{journal_id}:
    get:
      tags:
