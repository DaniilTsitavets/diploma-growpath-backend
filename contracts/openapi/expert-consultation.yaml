components:
  schemas:
    AnswerRequest:
      properties:
        body:
          type: string
          maxLength: 5000
          title: Body
      additionalProperties: false
      type: object
      required:
      - body
      title: AnswerRequest
    AnswerResponse:
      properties:
        ticket_id:
          type: string
          format: uuid
          title: Ticket Id
        status:
          $ref: '#/components/schemas/TicketStatus'
        answered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Answered At
        answer_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer Text
      type: object
      required:
      - ticket_id
      - status
      - answered_at
      - answer_text
      title: AnswerResponse
    CreateUserRequest:
      properties:
        email:
          type: string
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+$
          title: Email
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
        role:
          $ref: '#/components/schemas/Role'
      additionalProperties: false
      type: object
      required:
      - email
      - password
      - role
      title: CreateUserRequest
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthStatus
    MeResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        groups:
          items:
            type: string
          type: array
          title: Groups
      type: object
      required:
      - user_id
      - role
      - groups
      title: MeResponse
    PasswordRequest:
      properties:
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - password
      title: PasswordRequest
    PhotoResponse:
      properties:
        kind:
          type: string
          title: Kind
        url:
          type: string
          title: Url
      type: object
      required:
      - kind
      - url
      title: PhotoResponse
    QueueResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TicketSummaryResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: QueueResponse
    Role:
      type: string
      enum:
      - user
      - expert
      - admin
      title: Role
    RoleRequest:
      properties:
        role:
          $ref: '#/components/schemas/Role'
      additionalProperties: false
      type: object
      required:
      - role
      title: RoleRequest
    TicketResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          $ref: '#/components/schemas/TicketStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        answered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Answered At
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancelled At
        context:
          additionalProperties: true
          type: object
          title: Context
        photos:
          items:
            $ref: '#/components/schemas/PhotoResponse'
          type: array
          title: Photos
        answer_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer Text
      type: object
      required:
      - id
      - status
      - created_at
      - expires_at
      - answered_at
      - cancelled_at
      - context
      - photos
      - answer_text
      title: TicketResponse
    TicketStatus:
      type: string
      enum:
      - open
      - answered
      - cancelled
      title: TicketStatus
    TicketSummaryResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        species:
          anyOf:
          - type: string
          - type: 'null'
          title: Species
        created_at:
