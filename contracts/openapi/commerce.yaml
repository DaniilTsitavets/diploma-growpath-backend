openapi: 3.1.0
info:
  title: GrowPath commerce
  version: 0.1.0
  description: Catalog, orders, the mock payment and the first-purchase discount. Publishes `order.placed`.
    Identity arrives in the `X-User-Id` header, which the API gateway sets from the verified JWT. The
    `internal` tag marks operations the gateway does not expose.
paths:
  /health/live:
    get:
      tags:
      - health
      - internal
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: internal
  /health/ready:
    get:
      tags:
      - health
      - internal
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency is unreachable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: internal
  /v1/items:
    get:
      tags:
      - catalog
      summary: List Items
      description: 'Public: the gateway sets no identity for this route.'
      operationId: list_items_v1_items_get
      parameters:
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 40
          - type: 'null'
          title: Label
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Page size; defaults to 50 and is clamped to 100
          title: Limit
        description: Page size; defaults to 50 and is clamped to 100
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: Opaque `next_cursor` of the previous page; the items are ordered by slug
          title: Cursor
        description: Opaque `next_cursor` of the previous page; the items are ordered by slug
      responses:
        '200':
          description: A page of active items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
          headers:
            Cache-Control:
              description: The catalog is public and may be cached for a minute
              schema:
                type: string
                const: public, max-age=60
        '422':
          description: The request does not match the contract
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The catalog database is unreachable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: public
  /v1/items/{slug}:
    get:
      tags:
      - catalog
      summary: Get Item
      description: 'Public: the gateway sets no identity for this route.'
      operationId: get_item_v1_items__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: The active item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          headers:
            Cache-Control:
              description: The catalog is public and may be cached for a minute
              schema:
                type: string
                const: public, max-age=60
        '404':
          description: The resource does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The catalog database is unreachable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: public
  /v1/orders:
    post:
      tags:
      - orders
      summary: Create Order
      description: Place an order; repeating the request with the same key returns the same order (200).
      operationId: create_order_v1_orders_post
      parameters:
      - name: idempotency-key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          description: OK
        '401':
          description: The X-User-Id header is missing or malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '402':
          description: Payment was declined
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The resource does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request does not match the contract
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-gateway: public
components:
  schemas:
    CreateOrderRequest:
      properties:
        item_id:
          type: string
          format: uuid
          title: Item Id
      type: object
      required:
      - item_id
      title: CreateOrderRequest
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthStatus
    ItemPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ItemResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: ItemPage
    ItemResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        item_type:
          type: string
          title: Item Type
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        plant_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Plant Slug
        plant_species:
          anyOf:
          - type: string
          - type: 'null'
          title: Plant Species
        seed_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed Count
        price_cents:
          type: integer
          title: Price Cents
        currency:
          type: string
          const: EUR
          title: Currency
          default: EUR
        first_purchase_discount_pct:
          anyOf:
          - type: integer
          - type: 'null'
          title: First Purchase Discount Pct
        labels:
          items:
            type: string
          type: array
          title: Labels
      type: object
      required:
      - id
      - item_type
      - name
      - slug
      - plant_slug
      - plant_species
      - seed_count
      - price_cents
      - first_purchase_discount_pct
      - labels
      title: ItemResponse
    OrderResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        item_id:
          type: string
          format: uuid
          title: Item Id
        list_price_cents:
          type: integer
          title: List Price Cents
        discount_cents:
          type: integer
          title: Discount Cents
        total_paid_cents:
          type: integer
          title: Total Paid Cents
        currency:
          type: string
          const: EUR
          title: Currency
          default: EUR
        placed_at:
          type: string
          format: date-time
          title: Placed At
      type: object
      required:
      - id
      - item_id
      - list_price_cents
      - discount_cents
      - total_paid_cents
      - placed_at
      title: OrderResponse
    Problem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        code:
          type: string
          title: Code
        errors:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Errors
      type: object
      required:
      - type
      - title
      - status
      - detail
      - correlation_id
      - code
      title: Problem
      description: Problem details (RFC 7807) with a stable kebab-case `code`.
