[project]
name = "growpath"
version = "0.0.0"
description = "GrowPath backend workspace: one lock file for all services"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/observability", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
